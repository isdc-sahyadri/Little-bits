<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Complaints</title>

    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styling -->
    <style>
        .pri-bg {
            background-color: #7c01ff; /* Purple */
            color: white;
        }
        .btn-primary-custom {
            background-color: #7c01ff;
            border-color: #7c01ff;
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: #6601cc;
            border-color: #6601cc;
        }
    </style>
</head>
<body class="font-sans bg-light">

    <!-- Admin Dashboard Header -->
    <header class="pri-bg py-4">
        <div class="container text-center">
            <h1 class="display-4">Admin Dashboard</h1>
            <p>Manage Complaints and Issues</p>
        </div>
    </header>

    <!-- Complaints Section -->
    <section class="py-5">
        <div class="container">
            <h3 class="text-center mb-4">Complaint List</h3>
            <div class="accordion" id="complaintsAccordion">
                
                <!-- Complaint Item 1 -->
                <div class="card mb-3">
                    <div class="card-header" id="heading1">
                        <h5 class="mb-0">
                            <button class="btn btn-link" data-toggle="collapse" data-target="#collapse1" aria-expanded="true">
                                Complaint ID: 001 - John Doe
                            </button>
                        </h5>
                    </div>
                    <div id="collapse1" class="collapse show" data-parent="#complaintsAccordion">
                        <div class="card-body">
                            <p><strong>Issue:</strong> Internet not working</p>
                            <p><strong>Status:</strong> <span class="badge badge-warning">Pending</span></p>
                            <button class="btn btn-primary-custom btn-sm" data-toggle="modal" data-target="#complaintModal" onclick="loadComplaintInfo(1)">View More</button>
                        </div>
                    </div>
                </div>

                <!-- Complaint Item 2 -->
                <div class="card mb-3">
                    <div class="card-header" id="heading2">
                        <h5 class="mb-0">
                            <button class="btn btn-link" data-toggle="collapse" data-target="#collapse2">
                                Complaint ID: 002 - Jane Smith
                            </button>
                        </h5>
                    </div>
                    <div id="collapse2" class="collapse" data-parent="#complaintsAccordion">
                        <div class="card-body">
                            <p><strong>Issue:</strong> AC not functioning</p>
                            <p><strong>Status:</strong> <span class="badge badge-danger">Unresolved</span></p>
                            <button class="btn btn-primary-custom btn-sm" data-toggle="modal" data-target="#complaintModal" onclick="loadComplaintInfo(2)">View More</button>
                        </div>
                    </div>
                </div>

                <!-- Complaint Item 3 -->
                <div class="card mb-3">
                    <div class="card-header" id="heading3">
                        <h5 class="mb-0">
                            <button class="btn btn-link" data-toggle="collapse" data-target="#collapse3">
                                Complaint ID: 003 - Emily Johnson
                            </button>
                        </h5>
                    </div>
                    <div id="collapse3" class="collapse" data-parent="#complaintsAccordion">
                        <div class="card-body">
                            <p><strong>Issue:</strong> Water leakage</p>
                            <p><strong>Status:</strong> <span class="badge badge-success">Resolved</span></p>
                            <button class="btn btn-primary-custom btn-sm" data-toggle="modal" data-target="#complaintModal" onclick="loadComplaintInfo(3)">View More</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Complaint Details Modal -->
    <div class="modal fade" id="complaintModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Complaint Details</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div id="complaintDetails"></div>
                    <div class="form-group">
                        <label for="resolutionNotes">Resolution Notes</label>
                        <textarea class="form-control" id="resolutionNotes" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="status">Update Status</label>
                        <select class="form-control" id="status">
                            <option value="pending">Pending</option>
                            <option value="unresolved">Unresolved</option>
                            <option value="resolved">Resolved</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary-custom" onclick="updateComplaintStatus()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function loadComplaintInfo(complaintId) {
            let details = {
                1: {id: '001', name: 'John Doe', issue: 'Internet not working', status: 'Pending'},
                2: {id: '002', name: 'Jane Smith', issue: 'AC not functioning', status: 'Unresolved'},
                3: {id: '003', name: 'Emily Johnson', issue: 'Water leakage', status: 'Resolved'}
            }[complaintId];
            
            document.getElementById('complaintDetails').innerHTML = `
                <p><strong>Complaint ID:</strong> ${details.id}</p>
                <p><strong>User Name:</strong> ${details.name}</p>
                <p><strong>Issue:</strong> ${details.issue}</p>
                <p><strong>Status:</strong> ${details.status}</p>
            `;
            document.getElementById('status').value = details.status.toLowerCase();
        }

        function updateComplaintStatus() {
            alert('Complaint updated successfully!');
        }
    </script>
</body>
</html>
